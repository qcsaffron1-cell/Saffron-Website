<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S-LAB Hero Products Animation</title>
<style>
:root{--gold:#f2c14e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:#06380f;font-family:system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:12px}
.wrap{width:min(100%,1400px)}
.stage{container-type:inline-size;position:relative;aspect-ratio:1600/727;overflow:hidden;border-radius:14px;
 background:radial-gradient(ellipse at 52% 48%,#23852f 0%,#12702a 45%,#08521a 100%);perspective:1400px}
.abs{position:absolute;pointer-events:none}
.glow{left:52%;top:52%;width:70cqw;height:70cqw;margin:-35cqw 0 0 -35cqw;border-radius:50%;
 background:radial-gradient(circle,rgba(255,214,110,.55),rgba(255,200,80,.18) 40%,transparent 68%);opacity:0;mix-blend-mode:screen}
.rays{left:52%;top:52%;width:120cqw;height:120cqw;margin:-60cqw 0 0 -60cqw;border-radius:50%;opacity:0;mix-blend-mode:screen;
 background:repeating-conic-gradient(from 0deg,rgba(255,220,130,.16) 0 6deg,transparent 6deg 18deg);
 -webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%)}
.rays.on{animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rip{left:52%;top:52%;width:50cqw;height:50cqw;margin:-25cqw 0 0 -25cqw;border-radius:50%;opacity:0;
 border:.35cqw solid rgba(255,214,110,.9);box-shadow:0 0 2cqw rgba(255,200,80,.8),inset 0 0 2cqw rgba(255,200,80,.5)}
.frip{width:10cqw;height:2.6cqw;border-radius:50%;opacity:0;border:.22cqw solid rgba(255,214,110,.95);box-shadow:0 0 1.2cqw rgba(255,200,80,.8)}
.item{position:absolute;transform:perspective(900px) translateX(-50%) translate(var(--mx,0px),var(--my,0px)) rotateY(var(--ry,0deg));will-change:transform}
.in{position:relative;height:100%;opacity:0;transform-origin:50% 100%;will-change:transform,opacity}
.in img{display:block;height:100%;width:auto;filter:drop-shadow(0 .9cqw 1.1cqw rgba(0,20,5,.45));backface-visibility:hidden}
.in.idle img{animation:fl var(--fd,3.6s) ease-in-out var(--fs,0s) infinite alternate}
@keyframes fl{from{transform:translateY(0) rotate(-.25deg)}to{transform:translateY(-.7cqw) rotate(.25deg)}}
.sh{position:absolute;left:6%;right:6%;bottom:-1.1cqw;height:2cqw;border-radius:50%;background:rgba(0,18,4,.55);filter:blur(.6cqw);opacity:0}
.in.idle .sh{animation:shp var(--fd,3.6s) ease-in-out var(--fs,0s) infinite alternate}
@keyframes shp{from{transform:scale(1)}to{transform:scale(.88);opacity:.7}}
.shine{left:-35%;top:-15%;width:24%;height:130%;transform:skewX(-16deg);opacity:0;mix-blend-mode:soft-light;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 50%,transparent)}
.star{width:1.9cqw;height:1.9cqw;opacity:0;background:#ffe9a0;filter:drop-shadow(0 0 .5cqw #f2c14e);
 clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.leaf{width:2cqw;height:1.25cqw;border-radius:0 100% 0 100%;opacity:0;box-shadow:inset -.15cqw -.1cqw .3cqw rgba(0,0,0,.25)}
.bar{display:flex;gap:10px;align-items:center;margin-top:10px}
.prog{flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
button{font:500 14px system-ui;background:var(--gold);color:#12380f;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* S-LAB homepage banner embed mode: full-bleed, no standalone controls. */
html,body{width:100%;height:100%;min-height:0;margin:0;overflow:hidden;background:#12702a}
body{display:block;padding:0}
.wrap{width:100%;max-width:none;height:100%;margin:0}
.stage{width:100%;height:100%;aspect-ratio:1600/727;border-radius:0}
.bar{display:none!important}
</style></head><body>
<div class="wrap">
<div class="stage" id="stage" role="img" aria-label="ผลิตภัณฑ์ภูมิพฤกษา">
 <div class="abs rays" id="rays"></div>
 <div class="abs glow" id="glow"></div>
 <div id="back"></div>
 <div id="items"></div>
 <div id="fx"></div>
 <div class="abs shine" id="shine"></div>
</div>
<div class="bar"><div class="prog"><i id="pb"></i></div><button id="rp" type="button">เล่นซ้ำ</button></div>
</div>

var STEP=.42,T0=.7,POP=1.0; // seconds
var stage=document.getElementById('stage'),itemsEl=document.getElementById('items'),fx=document.getElementById('fx'),back=document.getElementById('back');
var A=[],its=[],spinTimer=null;
function mk(c,st,parent){var e=document.createElement('div');e.className=c;if(st)e.style.cssText=st;(parent||fx).appendChild(e);return e}
P.forEach(function(p,i){
 var it=mk('item','left:'+p.l+'%;bottom:'+p.b+'%;height:'+p.h+'%;aspect-ratio:'+p.r+';z-index:'+(i==3?3:2),itemsEl);
 var inn=mk('in','',it),im=new Image();im.src=p.s;im.alt=p.a;im.draggable=false;inn.appendChild(im);
 var sh=mk('sh','',inn);
 inn.style.setProperty('--fd',(3.2+i*.23).toFixed(2)+'s');inn.style.setProperty('--fs',(-i*.7)+'s');
 its.push({el:it,inn:inn,sh:sh,p:p});
});
function an(el,kf,o){var a=el.animate(kf,Object.assign({fill:'both'},o));A.push(a);return a}
var EO='cubic-bezier(.22,1,.36,1)';
function play(){
 if(spinTimer){clearTimeout(spinTimer);spinTimer=null;}
 A.forEach(function(a){try{a.cancel()}catch(e){}});A=[];fx.innerHTML='';back.innerHTML='';
 its.forEach(function(o){o.inn.classList.remove('idle')});

 var D=function(s){return s*1000};

 an(document.getElementById('glow'),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)',offset:.35},{opacity:.85,transform:'scale(1)'}],{duration:D(2.4),delay:D(.1),easing:EO}).finished.then(function(){
   an(document.getElementById('glow'),[{opacity:.85,transform:'scale(1)'},{opacity:1,transform:'scale(1.06)'}],{duration:D(3.2),direction:'alternate',iterations:Infinity,easing:'ease-in-out'});
 }).catch(function(){});
 an(document.getElementById('rays'),[{opacity:0},{opacity:1}],{duration:D(2.5),delay:D(.4)});

 // golden ripples from the centre
 [.15,.95,1.9].forEach(function(t){var r=mk('abs rip');
  an(r,[{opacity:0,transform:'scale(.15)'},{opacity:.9,offset:.12},{opacity:0,transform:'scale(1.55)'}],{duration:D(2.4),delay:D(t),easing:'cubic-bezier(.2,.6,.3,1)'})});
 // products pop in one by one
 its.forEach(function(o,i){
  var t=T0+i*STEP,p=o.p;
  var a=an(o.inn,[
   {opacity:0,transform:'translateY(22%) scale(.35)',offset:0},
   {opacity:1,transform:'translateY(-5%) scale(1.07)',offset:.55,easing:'cubic-bezier(.3,0,.2,1)'},

   {opacity:1,transform:'translateY(0) scale(1)',offset:1}],{duration:D(POP),delay:D(t),easing:EO});
  a.finished.then(function(){o.inn.classList.add('idle')}).catch(function(){});
  an(o.sh,[{opacity:0,transform:'scale(.2)'},{opacity:.9,transform:'scale(1.1)',offset:.6},{opacity:1,transform:'scale(1)'}],{duration:D(POP),delay:D(t),easing:EO});
  // floor ripple + sparkles at landing
  var lx=p.l,fy=100-p.b;
  var fr=mk('abs frip','left:'+lx+'%;top:'+fy+'%;margin:-1.3cqw 0 0 -5cqw');
  an(fr,[{opacity:0,transform:'scale(.3)'},{opacity:1,offset:.2},{opacity:0,transform:'scale(1.9)'}],{duration:D(1.3),delay:D(t+POP*.5),easing:'ease-out'});
  for(var k=0;k<3;k++){
   var sx=lx+(k-1)*(p.r*p.h*.55*(727/1600)*1.0)+ (k==1?0:0),sy=100-p.b-p.h*(.25+.3*k);

   an(s,[{opacity:0,transform:'scale(0) rotate(0)'},{opacity:1,transform:'scale(1.3) rotate(50deg)',offset:.4},{opacity:0,transform:'scale(0) rotate(110deg)'}],{duration:D(.9),delay:D(t+POP*.55+k*.14),easing:'ease-in-out'});
  }
 });
 // light sweep after the last item lands

  var l=mk('abs leaf','left:'+x+'%;top:-6%;background:'+cols[i%5]+';transform-origin:50% 50%;width:'+(2*sz)+'cqw;height:'+(1.25*sz)+'cqw');

  an(l,kf,{duration:D(dur),delay:D(st),easing:'linear'});
 })(i)}

}
// smooth pointer parallax (lerped)
var tx=0,ty=0,cx=0,cy=0,run=false;
function tick(){cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;
 its.forEach(function(o){var d=o.p.d;o.el.style.setProperty('--mx',(cx*d*-22).toFixed(2)+'px');o.el.style.setProperty('--my',(cy*d*-11).toFixed(2)+'px');o.el.style.setProperty('--ry',(cx*d*4).toFixed(2)+'deg')});
 var g=document.getElementById('glow');g.style.marginLeft=(-35+cx*-3)+'cqw';g.style.marginTop=(-35+cy*-2)+'cqw';
 if(Math.abs(tx-cx)+Math.abs(ty-cy)>.0005){requestAnimationFrame(tick)}else{run=false}}
function kick(){if(!run){run=true;requestAnimationFrame(tick)}}
stage.addEventListener('pointermove',function(e){var r=stage.getBoundingClientRect();tx=(e.clientX-r.left)/r.width-.5;ty=(e.clientY-r.top)/r.height-.5;kick()});

 tx=ty=cx=cy=0;
}
